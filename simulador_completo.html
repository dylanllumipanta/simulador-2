<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Sistema de Créditos</title>
</head>
<body>

<header>
  <h1>Sistema Básico de Créditos</h1>
   <link rel="stylesheet" href="simulador_completo.css">
</header>

<nav>

<button onclick="mostrarSeccion('parametros')">
Parámetros
</button>

<button onclick="mostrarSeccion('clientes')">
Clientes
</button>

<button onclick="mostrarSeccion('creditos')">
Créditos
</button>

<button onclick="mostrarSeccion('historial')">
Créditos Registrados
</button>

</nav>
<section id="parametros" class="activa">
  <h2>Configurar Parámetros</h2>

  <label>Tasa de interés:</label>
 <input type="number" id="tasaInteres" min="10" max="20" value="15">
  <span>%</span>

  <br>
  <button onclick="guardarTasa()">Guardar tasa</button>

  <p id="mensajeTasa"></p>
</section>

<section id="clientes">
  <h2>Registro de Clientes</h2>

<input type="text" id="txtCedula" placeholder="Cédula">

<input type="text" id="txtNombre" placeholder="Nombre">

<input type="text" id="txtApellido" placeholder="Apellido">

<input type="number" id="txtIngresos" placeholder="Ingresos">

<input type="number" id="txtEgresos" placeholder="Egresos">

  <br>

  <button onclick="guardarCliente();">Guardar cliente</button>

 <button onclick="limpiar();">Limpiar</button>
  <table>
    <thead>
      <tr>
        <th>Cédula</th>
        <th>Nombre</th>
        <th>Apellido</th>
        <th>Ingresos</th>
        <th>Egresos</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody id="tablaClientes">

    </tbody>
  </table>
</section>

<section id="creditos">

<h2>Simulación de Crédito</h2>


<label>Cédula del cliente:</label>

<input 
type="text" 
id="cedulaCredito"
placeholder="Ingrese cédula">


<button onclick="buscarClienteCredito()">
Buscar Cliente
</button>

<button 
id="btnAsignarCredito"
onclick="asignarCredito()"
disabled>

Asignar Crédito

</button>


<div id="datosClienteCredito">

</div>


<hr>


<h3>Datos del crédito</h3>


<label>Monto solicitado:</label>

<input 
type="number"
id="montoCredito">


<br>


<label>Plazo (años):</label>

<input 
type="number"
id="plazoCredito">


<br>


<button onclick="calcularCredito()">
Calcular Crédito
</button>


<div id="resultadoCredito">

</div>


</section>

<section id="historial">


<h2>
Historial de Créditos
</h2>


<input 
type="text"
id="cedulaHistorial"
placeholder="Cédula cliente">


<button onclick="buscarCreditosCliente()">

Buscar

</button>

<button onclick="pintarCreditos(creditos)">
Mostrar todos
</button>



<table>


<thead>

<tr>

<th>Cédula</th>

<th>Nombre</th>

<th>Apellido</th>

<th>Monto</th>

<th>Tasa</th>

<th>Plazo</th>

<th>Cuota</th>


</tr>

</thead>



<tbody id="tablaCreditos">


</tbody>



</table>


</section>



<script src="simulador_completo.js"></script>
<script src="utilitarios.js"></script>
</body>
</html>
